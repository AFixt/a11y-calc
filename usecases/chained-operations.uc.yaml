id: chained-operations
title: "Basic mode — chained operations (immediate execution)"
type: positive
description: "Pressing a second operator before equals evaluates the pending operation
  first. 2 + 3 yields 5 when + is pressed again, then + 4 gives 9. Documents the
  immediate-execution model (no operator precedence in basic mode)."

preconditions:
  - "Calculator is loaded in basic mode showing 0"

start_location: "http://localhost:4173"

expected_result: "The display shows 9"

steps:
  - locate: button "2"
  - focus: button "2"
  - activate: button "2"

  - locate: button "Add"
  - focus: button "Add"
  - activate: button "Add"

  - locate: button "3"
  - focus: button "3"
  - activate: button "3"

  # Pressing Add again evaluates 2 + 3 and shows the running total.
  - locate: button "Add"
  - focus: button "Add"
  - activate: button "Add"
  - verify: live_region "5"

  - locate: button "4"
  - focus: button "4"
  - activate: button "4"

  - locate: button "Equals"
  - focus: button "Equals"
  - activate: button "Equals"
  - verify: live_region "9"
