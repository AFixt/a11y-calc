id: every-basic-button-is-reachable
title: "Every basic-mode button is in the a11y tree and keyboard-focusable"
type: positive
# SCOPE NOTE: per the runner spec §5.8, `scope.for_each` resolves its iteration
# set on the initially-loaded page and replays `steps` once per element — there
# is no pre-loop navigation. The demo loads in BASIC mode, so this enumerates
# only the ~19 basic buttons plus the mode toggle. The ~30 scientific-panel
# buttons and the entire 2nd-function label set (x cubed, Cube root, Log base
# 10, 10 to the power of x, Inverse hyperbolic …, Arc …) are NOT reached here.
# That scientific gap is accepted explicitly: the demo shell (src/App.tsx)
# renders <Calculator /> with no props and has no query-param plumbing, so no
# start_location can land the demo in scientific mode. See issue #88.
description: "Audit-shaped check: enumerate every button rendered in basic mode and confirm
  each one is exposed in the accessibility tree (locate) and can receive keyboard
  focus (focus). A button that is visually present but missing a role/name, or
  that cannot be focused, fails its iteration. Basic mode only — see the scope
  note above for why scientific-mode buttons are out of scope."

preconditions:
  - "Calculator is loaded in basic mode showing 0"

start_location: "http://localhost:4173"

expected_result: "Every basic-mode button is reachable and focusable"

scope:
  for_each: 'role "button"'

steps:
  - locate: self
  - focus: self
