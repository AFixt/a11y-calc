id: scientific-power
title: "Scientific mode — raise to a power (xⁿ)"
type: positive
description: "Switch to scientific mode and compute 2 to the power of 3. The xⁿ button acts
  as a binary operator, so it is followed by the exponent and Equals."

preconditions:
  - "Calculator is loaded in basic mode showing 0"

start_location: "http://localhost:4173"

expected_result: "The display shows 8"

steps:
  - locate: button "Scientific"
  - focus: button "Scientific"
  - activate: button "Scientific"

  - locate: button "2"
  - focus: button "2"
  - activate: button "2"

  - locate: button "x to the power of n"
  - focus: button "x to the power of n"
  - activate: button "x to the power of n"

  - locate: button "3"
  - focus: button "3"
  - activate: button "3"

  - locate: button "Equals"
  - focus: button "Equals"
  - activate: button "Equals"
  - verify: live_region "8"
